# Builds the EfuChat admin panel and puts it on Firebase Hosting.
# Runs on every push that changes admin/, and by hand from the Actions tab.
name: Admin web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [admin/**, firebase.json, .github/workflows/admin-web.yml]

concurrency: admin-web

permissions:
  contents: read
  id-token: write

env:
  PROJECT: project-72f5d6ed-81b6-4920-86b

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/943586081894/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@project-72f5d6ed-81b6-4920-86b.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check that Google sign-in is switched on
        run: |
          TOKEN=$(gcloud auth print-access-token)
          CFG=$(curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/defaultSupportedIdpConfigs/google.com")
          DOMAINS=$(curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" \
            "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config" | node -e 'const c=JSON.parse(require("fs").readFileSync(0));process.stdout.write((c.authorizedDomains||[]).join(", "))')
          echo "Authorized domains: $DOMAINS"
          if echo "$CFG" | grep -q '"enabled": true'; then
            echo "Google sign-in: ON" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "$CFG"
            echo "::warning::Google sign-in is OFF. Turn it on: Firebase console > Authentication > Sign-in method > Google."
            echo "Google sign-in: OFF (turn it on in Firebase console > Authentication > Sign-in method)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Get the web app's Firebase settings
        run: |
          FB="npx --yes firebase-tools@15"
          APP_ID=$($FB apps:list WEB --project "$PROJECT" --json | node -e 'const r=JSON.parse(require("fs").readFileSync(0)).result||[];const a=r.find(x=>x.displayName==="EfuChat Admin");process.stdout.write(a?a.appId:"")')
          if [ -z "$APP_ID" ]; then
            APP_ID=$($FB apps:create WEB "EfuChat Admin" --project "$PROJECT" --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0)).result.appId)')
          fi
          $FB apps:sdkconfig WEB "$APP_ID" --project "$PROJECT" --json > sdk.json
          node -e '
            const raw = JSON.parse(require("fs").readFileSync("sdk.json")).result;
            const c = raw.sdkConfig ?? raw;
            const env = {
              VITE_FIREBASE_API_KEY: c.apiKey, VITE_FIREBASE_AUTH_DOMAIN: c.authDomain, VITE_FIREBASE_PROJECT_ID: c.projectId,
              VITE_FIREBASE_APP_ID: c.appId, VITE_FIREBASE_STORAGE_BUCKET: c.storageBucket ?? "", VITE_FIREBASE_MESSAGING_SENDER_ID: c.messagingSenderId ?? "",
            };
            require("fs").writeFileSync("admin/.env.production", Object.entries(env).map(([k, v]) => `${k}=${v}`).join("\n"));
          '
          rm sdk.json
      - name: Build
        run: npm --prefix admin ci && npm --prefix admin run build
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15 deploy --only hosting --project "$PROJECT" --non-interactive
      - name: Set up the short address
        id: short
        run: |
          FB="npx --yes firebase-tools@15"
          SITE=""
          for NAME in efuchat-admin efuchatadmin efuchat-admin-mw efuchat-mw-admin; do
            if $FB hosting:sites:get "$NAME" --project "$PROJECT" >/dev/null 2>&1 || \
               $FB hosting:sites:create "$NAME" --project "$PROJECT" --non-interactive >/dev/null 2>&1; then
              SITE=$NAME; break
            fi
          done
          [ -n "$SITE" ] || { echo "::error::No short address was free"; exit 1; }
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          # Let Google sign-in work on the short address.
          TOKEN=$(gcloud auth print-access-token)
          API="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT/config"
          H=(-H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT" -H "Content-Type: application/json")
          BODY=$(curl -s "${H[@]}" "$API" | SITE="$SITE" node -e '
            const c=JSON.parse(require("fs").readFileSync(0)); const d=new Set(c.authorizedDomains||[]);
            d.add(process.env.SITE+".web.app"); d.add(process.env.SITE+".firebaseapp.com");
            process.stdout.write(JSON.stringify({authorizedDomains:[...d]}));')
          curl -s -X PATCH "${H[@]}" "$API?updateMask=authorizedDomains" -d "$BODY" | node -e 'const c=JSON.parse(require("fs").readFileSync(0)); if(c.error){console.error(JSON.stringify(c.error));process.exit(1)} console.log("Authorized domains:", c.authorizedDomains.join(", "))'
          # Deploy the same build to the short address.
          node -e 'const f=JSON.parse(require("fs").readFileSync("firebase.json"));require("fs").writeFileSync("firebase.short.json",JSON.stringify({hosting:{...f.hosting,site:process.argv[1]}}))' "$SITE"
          $FB deploy --only hosting --config firebase.short.json --project "$PROJECT" --non-interactive
      - name: Address
        run: |
          echo "Admin panel is live at https://${{ steps.short.outputs.site }}.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "(also https://$PROJECT.web.app)" >> "$GITHUB_STEP_SUMMARY"
