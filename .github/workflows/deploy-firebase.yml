# Deploys the EfuChat database to Firebase.
#
# One-time setup in GitHub > Settings > Secrets and variables > Actions:
#   Variable  FIREBASE_PROJECT_ID    your Firebase project id, e.g. efuchat-mw
#   Secret    FIREBASE_SERVICE_ACCOUNT  the JSON key of a service account with the
#             "Firebase Admin" role (Firebase console > Project settings > Service accounts)
# Optional, once the project is on the Blaze plan:
#   Variable  DEPLOY_FUNCTIONS = true   also deploys the server functions
#   Secrets   PAYMENTS_WEBHOOK_SECRET, EFULOGISTIX_WEBHOOK_SECRET (any long random text)

name: Deploy database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - functions/**
      - .github/workflows/deploy-firebase.yml

concurrency: deploy-firebase

jobs:
  check:
    name: Check rules and server code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Compile server functions
        run: npm --prefix functions ci && npm --prefix functions run typecheck
      - name: Test security rules on the emulator
        run: |
          npm --prefix rules-test ci
          npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-efuchat "npm --prefix rules-test test"

  database:
    name: Deploy Firestore rules, indexes and settings
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore
        run: npx --yes firebase-tools@15 deploy --only firestore --project "${{ vars.FIREBASE_PROJECT_ID || 'project-72f5d6ed-81b6-4920-86b' }}" --non-interactive
      - name: Write prices, fees and app rules
        env:
          SEED_CONFIG_ONLY: 'true'
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'project-72f5d6ed-81b6-4920-86b' }}
        run: npm --prefix functions ci && npm --prefix functions run seed

  storage:
    name: Deploy storage rules
    needs: database
    runs-on: ubuntu-latest
    # Needs a Cloud Storage bucket (Firebase console > Storage > Get started), which needs the Blaze plan.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npx --yes firebase-tools@15 deploy --only storage --project "${{ vars.FIREBASE_PROJECT_ID || 'project-72f5d6ed-81b6-4920-86b' }}" --non-interactive

  functions:
    name: Deploy server functions
    needs: database
    if: vars.DEPLOY_FUNCTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Set function secrets
        env:
          P: ${{ vars.FIREBASE_PROJECT_ID || 'project-72f5d6ed-81b6-4920-86b' }}
          PAYMENTS_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
          EFULOGISTIX_WEBHOOK_SECRET: ${{ secrets.EFULOGISTIX_WEBHOOK_SECRET }}
          AIRTEL_CLIENT_ID: ${{ secrets.AIRTEL_CLIENT_ID }}
          AIRTEL_CLIENT_SECRET: ${{ secrets.AIRTEL_CLIENT_SECRET }}
          TNM_API_KEY: ${{ secrets.TNM_API_KEY }}
        run: |
          for name in PAYMENTS_WEBHOOK_SECRET EFULOGISTIX_WEBHOOK_SECRET AIRTEL_CLIENT_ID AIRTEL_CLIENT_SECRET TNM_API_KEY; do
            value="${!name}"
            # Until Airtel and TNM give you keys, a placeholder keeps the deploy working.
            [ -z "$value" ] && value="not-set-yet"
            printf '%s' "$value" | npx --yes firebase-tools@15 functions:secrets:set "$name" --data-file=- --project "$P" --non-interactive --force
          done
      - name: Deploy functions
        run: |
          npm --prefix functions ci
          npx --yes firebase-tools@15 deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID || 'project-72f5d6ed-81b6-4920-86b' }}" --non-interactive --force
