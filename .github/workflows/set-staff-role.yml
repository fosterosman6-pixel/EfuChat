# Gives someone an admin role (or removes it). They must have signed in to the admin panel once.
name: Set staff role

on:
  workflow_dispatch:
    inputs:
      email:
        description: Their Google email (the one they signed in to the admin panel with)
        required: true
      role:
        description: Role
        type: choice
        options: [owner, moderator, finance, support, none]
        default: moderator

permissions:
  contents: read
  id-token: write

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/943586081894/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@project-72f5d6ed-81b6-4920-86b.iam.gserviceaccount.com
      - run: npm --prefix functions ci
      - name: Set the role
        env:
          EMAIL: ${{ inputs.email }}
          ROLE: ${{ inputs.role }}
          GCLOUD_PROJECT: project-72f5d6ed-81b6-4920-86b
        run: node scripts/set-staff-role.mjs
